# 워크스페이스 루트 + 얇은 실행 파일.
#
# **이 bin 이 얇은 것에 이유가 있다.** 자산(`mc-assets`)과 본체(`mc-app`)를 여기서만
# 잇는다. `mc-app` 이 `mc-assets` 를 의존하면 자산 한 글자를 고칠 때마다 40,000줄이
# 다시 컴파일된다(실측 54.4초). 지금은 자산과 이 파일만 다시 컴파일된다.
[workspace]
members = ["crates/mc-app", "crates/mc-assets"]
# **이게 없으면 `cargo test` 가 0개를 돌리고 통과한다.** 루트 패키지가 있는 워크스페이스는
# 기본 대상이 루트 하나뿐인데, 루트는 20줄짜리 얇은 bin 이라 테스트가 없다.
# 그러면 "테스트 통과" 가 아무것도 의미하지 않는 상태가 조용히 만들어진다.
default-members = [".", "crates/mc-app", "crates/mc-assets"]

[package]
name = "mc-musicbot"
version = "0.7.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[dependencies]
mc-app = { path = "crates/mc-app" }
mc-assets = { path = "crates/mc-assets" }
